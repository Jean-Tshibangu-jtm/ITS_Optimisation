
[General]
network = VeinsScenario
sim-time-limit = 300s

*.manager.updateInterval = 1s

*.rsu[*].mobilityType = "TraCIMobility"
*.rsu[*].veinsmobilityType = "TraCIMobility"
*.rsu[*].veinsmobility.host = "localhost"
*.rsu[*].veinsmobility.port = 9999

*.rsu[*].interfaceTableModule = "^.interfaceTable"
*.rsu[*].routingTableModule = "^.routingTable"

*.rsu[*].wlan[0].radio.transmitter.power = 100mW
*.rsu[*].wlan[0].radio.receiver.sensitivity = -90dBm
*.rsu[*].wlan[0].radio.transmitter.communicationRange = 500m
*.rsu[*].numApps = 1
*.rsu[*].app[0].typename = "RSUApp"

*.vehicle[*].mobilityType = "TraCIMobility"
*.vehicle[*].veinsmobilityType = "TraCIMobility"
*.vehicle[*].veinsmobility.host = "localhost"
*.vehicle[*].veinsmobility.port = 9999

*.vehicle[*].interfaceTableModule = "^.interfaceTable"
*.vehicle[*].routingTableModule = "^.routingTable"

*.vehicle[*].wlan[0].radio.transmitter.power = 20mW
*.vehicle[*].wlan[0].radio.receiver.sensitivity = -89dBm
*.vehicle[*].wlan[0].radio.transmitter.communicationRange = 250m
*.vehicle[*].numApps = 1
*.vehicle[*].app[0].typename = "VehicleApp"

*.debug = true
